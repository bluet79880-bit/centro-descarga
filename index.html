<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLUET TECNOLOGÍA</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
    background:
        linear-gradient(rgba(5,7,13,.80),rgba(5,7,13,.90)),
        url("fondo.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    color:white;
    min-height:100vh;
}

header{
text-align:center;
padding:40px 20px;
}

header img{
width:180px;
border-radius:50%;
box-shadow:0 0 30px #00ccff;
animation:giro 8s linear infinite;
}

@keyframes giro{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

h1{
margin-top:20px;
font-size:40px;
color:#00c8ff;
}

p{
color:#bbb;
margin-top:10px;
}

.apps{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px;
}

.card{
background:#111827;
padding:25px;
border-radius:20px;
text-align:center;
transition:.4s;
box-shadow:0 0 20px rgba(0,255,255,.15);
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 30px cyan;
}

button{
margin-top:15px;
padding:12px 30px;
border:none;
border-radius:50px;
background:#00bfff;
color:white;
font-size:17px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#008cff;
}

footer{
text-align:center;
padding:30px;
color:#888;
}
</style>

</head>

<body>

<header>

<img src="logo.png">

<h1>BLUET TECNOLOGÍA</h1>

<p>Centro de Descargas</p>

</header>

<section class="apps">

<div class="card">
<h2>Xuper</h2>
<button>Descargar</button>
</div>

<div class="card">
<h2>VPN</h2>
<button>Descargar</button>
</div>

<div class="card">
<h2>FilmPlus</h2>
<button>Descargar</button>
</div>

<div class="card">
<h2>Magma TV</h2>
<button>Descargar</button>
</div>

</section>

<footer>

© 2026 BLUET TECNOLOGÍA

</footer>

</body>
</html>
