<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLUET TECNOLOGÍA | Smart TV</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background-image:
    linear-gradient(rgba(5,7,13,.80),rgba(5,7,13,.90)),
    url("fondo.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    color:white;
    min-height:100vh;
}

header{
    text-align:center;
    padding:40px 20px;
}

header img{
    width:170px;
    border-radius:50%;
    animation:giro 8s linear infinite;
    box-shadow:0 0 25px #8B5CF6;
}

@keyframes giro{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

h1{
    margin-top:20px;
    color:#8B5CF6;
    font-size:42px;
    text-shadow:0 0 20px #8B5CF6;
}

.subtitulo{
    margin-top:10px;
    color:#ddd;
    font-size:20px;
}

.apps{
    max-width:1100px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
    padding:40px 20px;
}

.card{

    background:rgba(25,25,35,.75);
    backdrop-filter:blur(12px);
    border-radius:18px;
    padding:25px;
    text-align:center;
    transition:.35s;
    border:1px solid rgba(139,92,246,.35);

}

.card:hover{

    transform:translateY(-8px);
    box-shadow:0 0 25px #8B5CF6;

}

.card h2{

    margin-bottom:20px;
    color:#fff;

}

.btn{

display:inline-block;
text-decoration:none;
background:#8B5CF6;
color:white;
padding:14px 30px;
border-radius:40px;
font-weight:bold;
transition:.3s;

}

.btn:hover{

background:#6D28D9;
transform:scale(1.05);
box-shadow:0 0 20px #8B5CF6;

}

.volver{

text-align:center;
margin:40px;

}

footer{

text-align:center;
padding:25px;
color:#bbb;

}

</style>

</head>

<body>

<header>

<img src="logo.png" alt="Logo">

<h1>BLUET TECNOLOGÍA</h1>

<p class="subtitulo">Aplicaciones para Smart TV</p>

</header>

<section class="apps">

<div class="card">
<h2>📺 Smart TV Versión 4.0</h2>
<a class="btn" href="apk/smarttv4.apk">⬇ Descargar</a>
</div>

<div class="card">
<h2>📺 Smart TV Versión 3.0</h2>
<a class="btn" href="apk/smarttv3.apk">⬇ Descargar</a>
</div>

<div class="card">
<h2>📺 Smart TV Versión 2.0</h2>
<a class="btn" href="apk/smarttv2.apk">⬇ Descargar</a>
</div>

<div class="card">
<h2>📺 Smart TV Versión 1.0</h2>
<a class="btn" href="apk/smarttv1.apk">⬇ Descargar</a>
</div>

</section>

<div class="volver">

<a class="btn" href="index.html">🏠 Volver al Inicio</a>

</div>

<footer>

© 2026 BLUET TECNOLOGÍA

</footer>

</body>
</html>
