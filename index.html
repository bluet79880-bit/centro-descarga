<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLUET TECNOLOGÍA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background-image:
    linear-gradient(rgba(5,7,13,.80),rgba(5,7,13,.90)),
    url("fondo.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    color:#fff;
    min-height:100vh;
}

header{
    text-align:center;
    padding:40px 20px;
}

header img{
    width:170px;
    border-radius:50%;
    animation:giro 8s linear infinite;
    box-shadow:0 0 25px #8B5CF6;
}

@keyframes giro{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

h1{
    margin-top:20px;
    font-size:42px;
    color:#8B5CF6;
    text-shadow:0 0 20px #8B5CF6;
}

.subtitulo{
    margin-top:10px;
    color:#ddd;
    font-size:22px;
}

.apps{

    max-width:1200px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));

    gap:25px;
    padding:40px 20px;

}

.card{

    background:rgba(20,20,30,.70);
    backdrop-filter:blur(10px);

    border-radius:20px;

    border:1px solid rgba(139,92,246,.35);

    padding:30px;

    text-align:center;

    transition:.35s;

}

.card:hover{

    transform:translateY(-10px);

    box-shadow:0 0 25px #8B5CF6;

}

.icono{

    font-size:60px;
    margin-bottom:15px;

}

.card h2{

    margin-bottom:10px;
    color:#fff;

}

.card p{

    color:#ccc;
    margin-bottom:25px;

}

.btn{

display:inline-block;

padding:14px 35px;

background:#8B5CF6;

color:#fff;

text-decoration:none;

border-radius:50px;

font-weight:bold;

transition:.3s;

}

.btn:hover{

background:#6D28D9;

transform:scale(1.05);

box-shadow:0 0 20px #8B5CF6;

}

footer{

text-align:center;

padding:30px;

color:#bbb;

}

</style>

</head>

<body>

<header>

<img src="logo.png" alt="Logo">

<h1>BLUET TECNOLOGÍA</h1>

<p class="subtitulo">
Centro de Descargas
</p>

</header>

<section class="apps">

<div class="card">

<div class="icono">📺</div>

<h2>Smart TV</h2>

<p>Aplicaciones para Smart TV.</p>

<a href="smarttv.html" class="btn">Abrir</a>

</div>

<div class="card">

<div class="icono">📡</div>

<h2>Xuper TV</h2>

<p>Versiones y aplicaciones Xuper TV.</p>

<a href="xupertv.html" class="btn">Abrir</a>

</div>

<div class="card">

<div class="icono">📱</div>

<h2>Teléfono</h2>

<p>Aplicaciones para Android.</p>

<a href="telefono.html" class="btn">Abrir</a>

</div>

<div class="card">

<div class="icono">📦</div>

<h2>Más App</h2>

<p>Herramientas y utilidades.</p>

<a href="masapp.html" class="btn">Abrir</a>

</div>

</section>

<footer>

© 2026 BLUET TECNOLOGÍA

</footer>

</body>
</html>
